name: migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones
        run: pnpm db:migrate
        env:
          # Neon: usa la cadena directa (sin pooler) para migrar.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
